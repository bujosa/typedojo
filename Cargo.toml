[package]
name = "typedojo"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A native, compiler-backed TypeScript practice dojo"
repository = "https://github.com/bujosa/typedojo"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter-highlight = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
